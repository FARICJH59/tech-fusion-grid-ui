# =============================================================================
# Mosquitto configuration — PRODUCTION TEMPLATE
# =============================================================================
# Copy to mosquitto.conf and fill in your paths/credentials before deploying.
# DO NOT use allow_anonymous true in production.
# =============================================================================

# ---------------------------------------------------------------------------
# TLS listener on standard MQTTS port
# ---------------------------------------------------------------------------
listener 8883
protocol mqtt

# CA certificate used to verify client certificates (mTLS)
cafile /etc/mosquitto/certs/ca.crt

# Server certificate and private key
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key

# Require clients to present a valid certificate
require_certificate true

# Use CN from the client certificate as the username
use_identity_as_username true

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Disable anonymous access — all clients must authenticate
allow_anonymous false

# Password file (create with: mosquitto_passwd -c /etc/mosquitto/passwd USERNAME)
password_file /etc/mosquitto/passwd

# ---------------------------------------------------------------------------
# Access Control List
# ---------------------------------------------------------------------------
# Restrict publish/subscribe by username and topic pattern.
# Replace "tenant-{username}" with your actual topic scheme.
#
# acl_file /etc/mosquitto/acl
#
# Example acl file contents:
# topic read  telemetry/%u/#
# topic write telemetry/%u/#
# topic read  commands/%u/#
# topic write commands/%u/#

# ---------------------------------------------------------------------------
# Persistence and logging
# ---------------------------------------------------------------------------
persistence true
persistence_location /var/lib/mosquitto/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection timeout (seconds)
keepalive_interval 60

# Maximum connections (tune per broker hardware)
max_connections 1000
