# =============================================================================
# Mosquitto configuration — Development / CI sandbox
# =============================================================================
# ⚠️  WARNING: This file is for local development and CI ONLY.
# In production, replace with a hardened broker configuration:
#   - disable anonymous access
#   - require TLS (listener on port 8883 with cafile/certfile/keyfile)
#   - enforce per-client ACLs (acl_file)
#   - enable password_file or use external auth plugin
# See mosquitto-config/mosquitto.production.example.conf for a template.
# =============================================================================

listener 1883
allow_anonymous true
persistence false
