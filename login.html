<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AESIRGRID OS // INGRESS GATEWAY</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-mono min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-6 rounded-lg space-y-4 shadow-2xl text-center">
    <div class="border-b border-slate-800 pb-3">
      <h2 class="text-cyan-400 font-bold text-xs uppercase tracking-wider">⚡ AESIRGRID CLIENT INGRESS PORTAL</h2>
    </div>
    <p class="text-xs text-slate-400">Authenticating access keys via multi-tenant OAuth passport checks to release secure system runtime containers.</p>
    
    <div class="space-y-2 pt-2">
      <button onclick="alert('Supabase Redirect Configuration: Open secure Google OAuth single sign-on pass.')" class="w-full bg-slate-950 hover:bg-slate-800 border border-slate-800 py-2.5 rounded text-xs font-bold transition flex items-center justify-center cursor-pointer">🔑 Sign In with Google Workspace</button>
    </div>

    <div class="border-t border-slate-800 pt-3">
      <label class="text-[10px] text-slate-500 uppercase font-bold block mb-1">Local Sandbox Pass-Thru Bypass</label>
      <button onclick="handleSimulatedCallback('manager@aesirgrid.com')" class="text-[11px] text-emerald-400 hover:underline cursor-pointer font-bold">⚡ Ingress as manager@aesirgrid.com (Bypass Integration Call)</button>
    </div>
  </div>

  <script>
    async function handleSimulatedCallback(mockUserEmail) {
      const res = await fetch('/api/auth/callback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: mockUserEmail })
      });
      const data = await res.json();
      if (data.success) { window.location.href = '/omnihub'; }
    }
  </script>
</body>
</html>
