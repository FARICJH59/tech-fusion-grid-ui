[package]
name = "aegisc"
version = "0.1.0"
edition = "2021"
description = "Aegis compiler prototype with linear Lease<T> checking"
license = "Apache-2.0"

[lib]
name = "aegisc"
path = "src/lib.rs"

[[bin]]
name = "aegisc"
path = "src/main.rs"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
