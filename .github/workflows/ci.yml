name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Quality gate: lint → typecheck → unit tests → build
  # ──────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nextjs-build-${{ github.sha }}
          path: .next/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Security: dependency audit
  # ──────────────────────────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (high severity)
        run: npm audit --audit-level=high

  # ──────────────────────────────────────────────────────────────────────────
  # Security: CodeQL static analysis
  # ──────────────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (CodeQL autobuild)
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  # ──────────────────────────────────────────────────────────────────────────
  # Docker: build and verify the container image
  # ──────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tech-fusion-grid-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # Integration: services + tests that require PostgreSQL, Redis, MQTT
  # ──────────────────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [quality]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        volumes:
          - ${{ github.workspace }}/mosquitto.conf:/mosquitto/config/mosquitto.conf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test
        env:
          REDIS_URL: redis://localhost:6379
          MQTT_URL: mqtt://localhost:1883
          JWT_SECRET: ci-integration-test-secret-32chars!!
          NODE_ENV: test

  # ──────────────────────────────────────────────────────────────────────────
  # Deployment readiness gate (main branch only)
  # ──────────────────────────────────────────────────────────────────────────
  readiness:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [quality, audit, docker, integration]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deployment ready
        run: |
          echo "✅ All quality, security, and integration checks passed."
          echo "   Branch: ${{ github.ref_name }}"
          echo "   SHA:    ${{ github.sha }}"
          echo ""
          echo "⚠️  Production blockers to resolve before deploying:"
          echo "   - Configure SUPABASE_URL + SUPABASE_ANON_KEY in production"
          echo "   - Set JWT_SECRET (min 32 chars) via GitHub Secrets"
          echo "   - Set REDIS_URL to a production Redis instance"
          echo "   - Configure MQTT_URL to the production broker"
          echo "   - Review OTEL_EXPORTER_OTLP_ENDPOINT for observability"
